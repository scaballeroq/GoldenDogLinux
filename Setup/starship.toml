# 🚀 Starship Config: Golden Dog Linux (Debian 13 Trixie + Nerd Fonts)
# Paleta inspirada en el prompt nativo de Golden Dog Linux (#d97cdc rosa + cyan)

# Formato general del prompt
format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$package\
$nodejs\
$rust\
$python\
$java\
$docker_context\
$line_break\
$character"""

# Línea en blanco entre comandos para legibilidad
add_newline = true

# Carácter del prompt (Minimalista)
[character]
success_symbol = "[❯](bold #d97cdc)"
error_symbol = "[✖](bold red)"

# Icono del SO (Logo huella oficial Golden Dog Linux en Nerd Fonts: " " / "󰏩 "; alternativa Debian: " ")
[os]
format = "[$symbol]($style) "
style = "bold #e8357a"
disabled = false

[os.symbols]
Linux = " "
Debian = " "
Unknown = " "

# Usuario y Hostname (Mantiene el rosa característico de Golden Dog Linux)
[username]
show_always = true
style_user = "bold #d97cdc"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bold #d97cdc"
format = "[@$hostname]($style) "

# Configuración del Directorio
[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold cyan"
read_only = " 󰌾"
home_symbol = "󱂵 ~"

# Git Branch (Con icono de Nerd Fonts)
[git_branch]
symbol = " "
style = "bold #d97cdc"
format = "on [$symbol$branch]($style) "

# Git Status (Visual y detallado)
[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold red"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "󰹹 ⇡${ahead_count}⇣${behind_count}"
conflicted = "󰞇 "
untracked = "󰋗 "
stashed = "󰏖 "
modified = "󰏫 "
staged = "󰐖 "
renamed = "󰏬 "
deleted = "󰆴 "

# --- Módulos de Lenguajes (Solo se muestran si estás en un proyecto) ---

[nodejs]
symbol = " "
style = "bold green"
format = "via [$symbol($version)]($style) "

[rust]
symbol = " "
style = "bold orange"
format = "via [$symbol($version)]($style) "

[python]
symbol = " "
style = "bold yellow"
format = "via [$symbol($version) ($virtualenv)]($style) "

[java]
symbol = " "
style = "bold red"
format = "via [$symbol($version)]($style) "

# Docker
[docker_context]
symbol = " "
style = "bold blue"
format = "on [$symbol$context]($style) "

# Package Manager
[package]
symbol = "󰏗 "
format = "is [$symbol$version]($style) "
